<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle dépense</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">


    <style>

        body{
            background:#0F0F0F;
            color:white;
        }

        .card{
            background:#1A1A1A;
            border:1px solid #D4AF37;
            margin-top:50px;
        }

        .btn-gold{
            background:#D4AF37;
            color:black;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card p-4">

        <h2 class="text-warning mb-4">
            Nouvelle dépense
        </h2>

        <form method="POST">

            <div class="mb-3">
                <label>Description</label>
                <input type="text"
                       name="description"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Montant</label>
                <input type="number"
                       name="montant"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Catégorie</label>
                <select name="categorie" class="form-control">

                    <option>Nourriture</option>
                    <option>Transport</option>
                    <option>Internet</option>
                    <option>Loisirs</option>
                    <option>Santé</option>
                    <option>Autres</option>

                </select>
            </div>

            <div class="mb-3">
                <label>Date</label>
                <input type="date"
                       name="date_depense"
                       class="form-control"
                       required>
            </div>

            <button class="btn btn-gold">
                Enregistrer
            </button>

        </form>

    </div>

</div>

</body>

</html>
