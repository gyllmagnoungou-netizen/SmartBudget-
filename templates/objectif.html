<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Objectif d'épargne
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="gold-glow"></div>

<nav class="navbar">

    <div class="container-fluid px-5">

        <span class="brand">
            SMARTBUDGET
        </span>

        <a href="/dashboard" class="btn btn-outline">

            Retour Dashboard

        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="stat-card">

        <h2 class="text-warning mb-4">

             Objectif d'épargne

        </h2>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">

                    Nom de l'objectif

                </label>

                <input
                    type="text"
                    name="titre"
                    class="form-control"
                    placeholder="Ordinateur portable, Moto, Voyage..."
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Montant cible (FCFA)

                </label>

                <input
                    type="number"
                    name="montant_cible"
                    class="form-control"
                    placeholder="500000"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-gold">

                💾 Enregistrer l'objectif

            </button>

        </form>

    </div>

</div>

</body>

</html>
