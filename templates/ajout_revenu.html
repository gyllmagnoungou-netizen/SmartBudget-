<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau revenu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">


    <style>

        body{
            background:#0F0F0F;
            color:white;
        }

        .card-revenu{
            background:#1A1A1A;
            border:1px solid #D4AF37;
            border-radius:20px;
            padding:30px;
            margin-top:50px;
        }

        .titre{
            color:#D4AF37;
            margin-bottom:25px;
        }

        .btn-gold{
            background:#D4AF37;
            color:black;
            font-weight:bold;
            border:none;
        }

        .btn-gold:hover{
            background:#c79f2d;
            color:black;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card-revenu">

        <h2 class="titre">
            Nouveau revenu
        </h2>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Source du revenu
                </label>

                <input
                    type="text"
                    name="source"
                    class="form-control"
                    placeholder="Salaire, Freelance, Commerce..."
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Montant (FCFA)
                </label>

                <input
                    type="number"
                    name="montant"
                    class="form-control"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Date
                </label>

                <input
                    type="date"
                    name="date_revenu"
                    class="form-control"
                    required>

            </div>

            <button type="submit" class="btn btn-gold">
                Enregistrer le revenu
            </button>

            <a href="/" class="btn btn-secondary ms-2">
                Retour
            </a>

        </form>

    </div>

</div>

</body>

</html>
