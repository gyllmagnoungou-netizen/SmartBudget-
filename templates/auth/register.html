<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - SmartBudget</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#0F0F0F;
            color:white;
        }

        .card-register{
            max-width:500px;
            margin:80px auto;
            background:#1A1A1A;
            border:1px solid #D4AF37;
            border-radius:20px;
            padding:30px;
        }

        .title{
            color:#D4AF37;
            text-align:center;
            margin-bottom:30px;
        }

        label{
            color:#D4AF37;
            margin-bottom:5px;
        }

        .form-control{
            background:#252525;
            border:1px solid #444;
            color:white;
        }

        .form-control:focus{
            background:#252525;
            color:white;
            border-color:#D4AF37;
            box-shadow:none;
        }

        .btn-gold{
            background:#D4AF37;
            color:black;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card-register">

        <h2 class="title">
            Créer un compte
        </h2>

<form method="POST">

    <div class="mb-3">

        <label>Nom complet</label>

        <input
            type="text"
            name="nom"
            class="form-control"
            placeholder="Votre nom complet"
            required>

    </div>

    <div class="mb-3">

        <label>Adresse email</label>

        <input
            type="email"
            name="email"
            class="form-control"
            placeholder="exemple@email.com"
            required>

    </div>

    <div class="mb-3">

        <label>Mot de passe</label>

        <input
            type="password"
            name="mot_de_passe"
            class="form-control"
            placeholder="********"
            required>

    </div>

    <button type="submit" class="btn btn-gold w-100">
        Créer mon compte
    </button>

    <a href="/" class="btn btn-secondary w-100 mt-2">
        Retour
    </a>

</form>

    </div>

</div>

</body>
</html>
