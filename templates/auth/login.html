<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte - SmartBudget</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#0F0F0F;
            color:white;
            min-height:100vh;
        }

        .navbar{
            background:#111111;
            border-bottom:1px solid #D4AF37;
        }

        .brand{
            color:#D4AF37;
            font-size:1.5rem;
            font-weight:700;
            letter-spacing:3px;
        }

        .register-container{
            max-width:700px;
            margin:80px auto;
        }

        .register-card{
            background:#1A1A1A;
            border:1px solid rgba(212,175,55,0.3);
            border-radius:20px;
            padding:40px;
        }

        .title{
            color:#D4AF37;
            text-align:center;
            margin-bottom:30px;
        }

        label{
            color:#D4AF37;
            font-weight:500;
            margin-bottom:5px;
        }

        .form-control{
            background:#252525;
            border:1px solid #444;
            color:white;
        }

        .form-control:focus{
            background:#252525;
            color:white;
            border-color:#D4AF37;
            box-shadow:none;
        }

        .btn-gold{
            background:#D4AF37;
            color:black;
            font-weight:600;
            border:none;
        }

        .btn-gold:hover{
            background:#c79f2d;
            color:black;
        }

    </style>

</head>

<body>

<nav class="navbar">
    <div class="container">

        <span class="brand">
            SMARTBUDGET
        </span>

    </div>
</nav>

<div class="container register-container">

    <div class="register-card">

        <h2 class="title">
            Créer un compte
        </h2>

        <form method="POST">

            <div class="mb-3">

                <label>Nom complet</label>

                <input
                    type="text"
                    name="nom"
                    class="form-control"
                    placeholder="Votre nom complet"
                    required>

            </div>

            <div class="mb-3">

                <label>Adresse email</label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="exemple@email.com"
                    required>

            </div>

            <div class="mb-4">

                <label>Mot de passe</label>

                <input
                    type="password"
                    name="mot_de_passe"
                    class="form-control"
                    placeholder="********"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-gold w-100">

                Créer mon compte

            </button>

            <a
                href="/login"
                class="btn btn-outline-light w-100 mt-2">

                Déjà un compte ? Se connecter

            </a>

            <a
                href="/"
                class="btn btn-secondary w-100 mt-2">

                Retour à l'accueil

            </a>

        </form>

    </div>

</div>

</body>

</html>
